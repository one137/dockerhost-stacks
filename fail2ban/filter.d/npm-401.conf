# For NPM's 401 errors in proxy-host-X_access.log
[Definition]
# If CF-conn-IP is present and not "-", use that, otherwise use Client IP
failregex = 401 - \S+ \S+ \S+ "[^"]*" \[Client [^\]]+\] \[CF-conn-IP <HOST>\]
            401 - \S+ \S+ \S+ "[^"]*" \[Client <HOST>\] (?:\[CF-conn-IP -\]|\[Length)
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z]

