[Definition]
actionban = curl -s -X POST <_cf_headers> <_cf_url> \
                -d '{"mode":"block","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"Fail2Ban - jail <name>"}'

actionunban = id=$(curl -s <_cf_headers> "<_cf_url>?mode=block&configuration_target=<cftarget>&configuration_value=<ip>" \
                  | jq -r '.result[0].id')
              if [ "$id" = "null" ]; then echo "<name>: id for <ip> cannot be found"; exit 0; fi;
              curl -s -o /dev/null -X DELETE <_cf_headers> "<_cf_url>/$id"

[Init]
# Set in cloudflare-firewall.local (gitignored)
cftoken =
cftarget = ip
_cf_url = https://api.cloudflare.com/client/v4/user/firewall/access_rules/rules
_cf_headers = -H "Authorization: Bearer <cftoken>" -H "Content-Type: application/json"

[Init?family=inet6]
cftarget = ip6
