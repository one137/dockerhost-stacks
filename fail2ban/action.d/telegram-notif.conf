[Definition]
actionstart = curl -X POST https://api.telegram.org/bot<token>/sendMessage \
              -d chat_id=<chat_id> \
              -d text="🟢 The jail <name> has been started successfully."

actionstop = curl -X POST https://api.telegram.org/bot<token>/sendMessage \
             -d chat_id=<chat_id> \
             -d text="🔴 The jail <name> has been stopped."

actionban = curl -X POST https://api.telegram.org/bot<token>/sendMessage \
            -d chat_id=<chat_id> \
            -d "text=fail2ban: Banned <ip> to jail <name>" # -- <matches>

actionunban = curl -X POST https://api.telegram.org/bot<token>/sendMessage \
              -d chat_id=<chat_id> \
              -d "text=✅ Unbanned <ip> from jail '<name>'"

[Init]
# Set in telegram-notif.local (gitignored)
token =
chat_id =

