# set_real_ip_from 10.0.0.0/8;
# set_real_ip_from 172.16.0.0/12; # Includes Docker subnet
# set_real_ip_from 192.168.0.0/16;

log_format default_plus_cf '[$time_local] $upstream_cache_status $upstream_status $status - $request_method $scheme $host "$request_uri" [Client $remote_addr] [CF-conn-IP $http_cf_connecting_ip] [Length $body_bytes_sent] [Gzip $gzip_ratio] [Sent-to $server] ([http_x_forwarded_for $http_x_forwarded_for] [http_x_real_ip $http_x_real_ip]) "$http_user_agent" "$http_referer"';
