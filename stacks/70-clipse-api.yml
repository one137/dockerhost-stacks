services:
  clipse-api:
    image: ghcr.io/one137/clipse-api:latest
    container_name: ct-clipse-api
    user: 1001:1001 # dockeruser, owns the history file
    volumes:
      - /srv/docker/volumes/syncthing/data/clipse-history:/app/clipse-history
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - CLIPBOARD_JSON_FILE=${CLIPBOARD_JSON_FILE}
      # Any docker address: wide on purpose, so no recreate can make it stale:
      - TRUSTED_PROXY_CIDR=172.16.0.0/12
      - TZ=Europe/Zurich
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped
